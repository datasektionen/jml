name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Nomad
        uses: datasektionen/nomad-deploy@v1
        with:
          build-vars: |
            REACT_APP_RECAPTCHA_PUBLIC_KEY=6Lc7T6IrAAAAAJ2f5PK3vBm19HcvVRNESlZm46Y2
            REACT_APP_LOGIN_API_URL: https://sso.datasektionen.se/legacyapi

          github-token: ${{ secrets.GITHUB_TOKEN }}
          nomad-token: ${{ secrets.NOMAD_TOKEN }}
          nomad-addr: ${{ vars.NOMAD_ADDR }}
